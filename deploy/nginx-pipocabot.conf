# Config de exemplo do nginx pro PipocaBot — termina HTTPS e repassa
# pro backend, que fica ouvindo só em 127.0.0.1:8000 (nunca exposto
# direto na internet).
#
# Troque SEU_DOMINIO_AQUI pelo domínio/subdomínio real (ex:
# bot.diadepipocas.com.br) antes de instalar.
#
# Instalar (como root, no VPS, depois de já ter o nginx instalado):
#   cp deploy/nginx-pipocabot.conf /etc/nginx/sites-available/pipocabot
#   ln -s /etc/nginx/sites-available/pipocabot /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Depois disso, gerar o certificado com certbot (ver docs/09-deploy-vps.md).

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO_AQUI;

    # Necessário pro certbot validar o domínio antes do certificado existir.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name SEU_DOMINIO_AQUI;

    # Preenchido automaticamente pelo certbot na primeira emissão —
    # não precisa criar esses arquivos à mão.
    ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO_AQUI/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO_AQUI/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
